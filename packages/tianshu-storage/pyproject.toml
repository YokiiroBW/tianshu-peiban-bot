[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-storage"
version = "0.1.3"
description = "Explicit SQLite/PostgreSQL selection, disposable Redis caches and immutable files"
requires-python = ">=3.12"
dependencies = ["psycopg[binary,pool]==3.3.6", "redis==7.4.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "fakeredis==2.40.0", "ruff==0.17.1"]

[project.scripts]
tianshu-storage = "tianshu_storage.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
