[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu-plugin"
version = "2.0.0"
description = "Native TianShu plugin SDK"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tianshu_plugin = ["*.js"]
