global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/config/observability/alerts.yaml]
scrape_configs:
  - job_name: vector
    static_configs:
      - targets: ['127.0.0.1:18687']
  - job_name: loki
    static_configs:
      - targets: ['127.0.0.1:13100']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:19491']
