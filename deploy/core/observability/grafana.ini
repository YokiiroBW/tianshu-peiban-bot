[paths]
data = /data/observability/grafana
logs = /data/observability/grafana/logs
plugins = /data/observability/grafana/plugins
provisioning = /config/observability/grafana
[server]
http_addr = 0.0.0.0
http_port = 19490
[security]
admin_user = admin
admin_password = ${GF_SECURITY_ADMIN_PASSWORD}
[users]
allow_sign_up = false
[auth.anonymous]
enabled = false
[analytics]
reporting_enabled = false
check_for_updates = false
[log]
mode = console
