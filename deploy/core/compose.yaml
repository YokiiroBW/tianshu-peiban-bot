name: tianshu-core
services:
  tianshu:
    image: ${TIANSHU_IMAGE:?set an immutable verified product image}
    container_name: tianshu-core
    restart: unless-stopped
    env_file: .env
    read_only: true
    working_dir: /opt/tianshu
    user: '0:10001'
    cap_drop: [ALL]
    # PID 1 repairs modes on the UID 10001 data tree; DAC_OVERRIDE does not authorize chmod.
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, KILL, DAC_OVERRIDE]
    security_opt: [no-new-privileges:true, 'seccomp=./seccomp-chromium.json']
    stop_grace_period: 120s
    pids_limit: 768
    shm_size: 512m
    mem_limit: ${TIANSHU_MEMORY_LIMIT:-10g}
    cpus: ${TIANSHU_CPU_LIMIT:-6}
    ports:
      - '${TIANSHU_HTTP_BIND:-0.0.0.0}:18446:18446'
      - '${TIANSHU_HTTPS_BIND:-0.0.0.0}:18443:18443'
      - '${TIANSHU_ONEBOT_BIND:-0.0.0.0}:18765:18765'
      - '127.0.0.1:19490:19490'
      - '127.0.0.1:19491:19491'
    volumes:
      - ./config:/config:ro
      - ./data:/data:rw
      # Exact external media binds are added by the release owner from the reviewed manifest.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m,mode=1777
      - /run/tianshu:rw,noexec,nosuid,size=64m,mode=0755
    labels:
      io.tianshu.product: core
      io.tianshu.release: ${TIANSHU_RELEASE_ID:?set release identity}
    logging:
      driver: local
      options: {max-size: 10m, max-file: '3'}
