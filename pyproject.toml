[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu"
version = "1.0.0"
description = "The modular TianShu companion application"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.1",
  "psycopg[binary,pool]==3.3.6",
  "pgvector==0.5.1",
  "procrastinate==3.10.0",
  "jsonschema==4.26.0",
  "httpx==0.28.1",
  "referencing==0.37.0",
  "cryptography==50.0.1",
  "Pillow==12.3.0",
  "av==19.0.1",
  "msgpack>=1.1,<2",
  "edge-tts==7.3.1",
  "mutagen==1.48.1",
  "lxml==6.1.3",
  "beautifulsoup4>=4.13,<5",
  "python-docx>=1.2,<2",
  "pypdf>=6.19,<7",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2", "ruff==0.17.1"]

[project.scripts]
tianshu = "tianshu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tianshu.runtime" = ["*.sql"]
"tianshu.models" = ["*.sql"]
"tianshu.capabilities" = ["*.sql", "**/*.json", "**/*.html", "**/*.js"]
"tianshu.companion" = ["*.sql", "data/*.json"]
"tianshu.life" = ["*.sql"]
"tianshu.conversation" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = [
  "tests/runtime", "tests/models", "tests/capabilities", "tests/identity", "tests/sources",
  "tests/memory", "tests/context", "tests/companion", "tests/life", "tests/conversation",
  "tests/channels",
]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
