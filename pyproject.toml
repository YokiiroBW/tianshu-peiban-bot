[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshu"
version = "1.0.0"
description = "The modular TianShu companion application"
requires-python = ">=3.12"
dependencies = [
  "aiohttp==3.14.1",
  "psycopg[binary,pool]==3.3.6",
  "pgvector==0.5.1",
  "procrastinate==3.10.0",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio>=1,<2", "ruff==0.17.1"]

[project.scripts]
tianshu = "tianshu.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tianshu.runtime" = ["*.sql"]
"tianshu.models" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests/runtime", "tests/models", "tests/capabilities", "tests/core"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
